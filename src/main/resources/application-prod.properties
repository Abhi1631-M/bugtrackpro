# ── Production profile (activated by SPRING_PROFILES_ACTIVE=prod) ─────────────
# Disable SQL logging in production
spring.jpa.show-sql=false

# Don't auto-drop/create tables in production — only validate schema
spring.jpa.hibernate.ddl-auto=update

# Connection pool tuning for Railway free tier (512 MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Compress responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html
